name: YouTube 자동 요약

on:
  workflow_dispatch:
    inputs:
      url:
        description: 유튜브 URL 또는 영상 ID
        required: true
      lang:
        description: 자막 언어 우선순위 (쉼표 구분)
        required: false
        default: ko,en
      commit:
        description: 요약 결과를 저장소에 커밋할지 여부
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 요약 생성
        id: summarize
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python src/summarize.py "${{ inputs.url }}" --lang "${{ inputs.lang }}"

      - name: 결과 커밋
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summaries
          git diff --staged --quiet || {
            git commit -m "요약 추가: ${{ inputs.url }}"
            git push
          }
